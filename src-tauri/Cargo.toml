[package]
name = "transkerat"
version = "0.3.0"
description = "100% lokal svensk transkribering (Pianissimo / transcribe.cpp) och integritetsmaskering (Maskera)"
authors = ["Patrik Svensk"]
edition = "2021"

[lib]
name = "transkerat_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["stream", "native-tls"] }
tokio = { version = "1", features = ["rt"] }
hound = "3.5.1"
futures-util = "0.3.32"
sysinfo = "0.33.1"
symphonia = { version = "0.5", default-features = false, features = [
    "mp3", "aac", "isomp4", "wav", "ogg", "vorbis", "flac", "pcm", "adpcm"
] }
num_cpus = "1.16"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
anyhow = "1"
# Maskering Lager 2 (KBLab Svensk BERT NER) via ONNX Runtime
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-native"] }
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex", "progressbar"] }
ndarray = "0.17"
regex = "1"
sha2 = "0.10"
# Talaridentifiering: pyannote community-1-pipelinen i ren Rust (CPU).
speakrs = { path = "vendor/speakrs", default-features = false, features = ["cpu"] }

# Svensk taligenkänning (Pianissimo GGUF) via transcribe.cpp (ggml): Metal på macOS, Vulkan på Windows, CPU fallback
[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.15.3"
transcribe-cpp = { version = "0.4.2", default-features = false, features = ["metal"] }

[target.'cfg(target_os = "windows")'.dependencies]
transcribe-cpp = { version = "0.4.2", default-features = false, features = ["vulkan"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Threading",
] }

[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
transcribe-cpp = { version = "0.4.2", default-features = false }

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 3
debug = false
