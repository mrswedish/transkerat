[package]
name = "transkerat"
version = "0.1.0"
description = "100% lokal svensk transkribering (Pianissimo) och integritetsmaskering (Maskera)"
authors = ["Patrik Svensk"]
edition = "2021"

[lib]
name = "transkerat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["stream", "native-tls"] }
tokio = { version = "1", features = ["rt"] }
hound = "3.5.1"
futures-util = "0.3.32"
sysinfo = "0.33.1"
symphonia = { version = "0.5", default-features = false, features = [
    "mp3", "aac", "isomp4", "wav", "ogg", "vorbis", "flac", "pcm", "adpcm"
] }
num_cpus = "1.16"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
anyhow = "1"
# Gemensam ONNX Runtime för både Pianissimo (svensk taligenkänning) och KBLab Svensk BERT NER (maskering)
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-native"] }
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex", "progressbar"] }
ndarray = "0.17"
rustfft = "6.4"
regex = "1"
sha2 = "0.10"
# Talaridentifiering: pyannote community-1-pipelinen i ren Rust (CPU, ingen onnxruntime).
speakrs = { path = "vendor/speakrs", default-features = false, features = ["cpu"] }

[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.15.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Threading",
] }

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 3
debug = false
